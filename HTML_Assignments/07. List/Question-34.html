<dl>
    <dt>Unordered List</dt>
    <dd>A list in which items are displayed with bullets and no specific order.</dd>

    <dt>Ordered List</dt>
    <dd>A list in which items are displayed in a specific sequence using numbers or letters.</dd>

    <dt>Description List</dt>
    <dd>A list used to display terms along with their corresponding descriptions.</dd>
</dl>
