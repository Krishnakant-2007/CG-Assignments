<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Semantic Code Elements</title>

    <style>
        pre {
            background-color: #1e1e1e;
            color: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
        }

        kbd {
            background-color: #f1f1f1;
            border: 1px solid #999;
            padding: 3px 7px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Semantic HTML Code Elements</h1>

    <!-- Inline code -->
    <p>Use <code>color: blue;</code> to change the text color.</p>

    <!-- Multi-line code block -->
    <pre>
&lt;h1&gt;Hello World&lt;/h1&gt;
&lt;p&gt;This is a paragraph.&lt;/p&gt;
    </pre>

    <!-- Keyboard shortcut -->
    <p>Press <kbd>Ctrl + S</kbd> to save your file.</p>

    <!-- Sample output -->
    <p>If something goes wrong, you might see <samp>Error: File not found</samp>.</p>

    <!-- Variable -->
    <p>The variable <var>count</var> stores the number of items.</p>

</body>
</html>
