<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Keyboard Input</title>

    <style>
        kbd {
            background-color: #f1f1f1;
            border: 1px solid #999;
            padding: 4px 8px;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <p>Press <kbd>Enter</kbd> to continue.</p>

</body>
</html>
