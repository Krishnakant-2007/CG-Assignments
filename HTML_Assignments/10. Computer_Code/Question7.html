<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Preformatted Code</title>
</head>
<body>

    <!-- Inline code is used within a sentence -->
    <p>You can change the text color using the CSS property <code>color: red;</code>.</p>

    <!-- Preformatted code is used for multi-line code -->
    <pre>
git init
git add .
git commit -m "Initial commit"
git branch -M main
git push -u origin main
    </pre>

</body>
</html>
