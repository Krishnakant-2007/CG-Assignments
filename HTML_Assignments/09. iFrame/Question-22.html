<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Permissions</title>

    <style>
        iframe {
            border: none;
        }
    </style>
</head>
<body>

    <iframe
        src="https://www.example.com"
        width="700"
        height="450"
        title="Fullscreen and USB Enabled Content"
        allow="fullscreen; usb">
    </iframe>

</body>
</html>
