<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Frame</title>

    <style>
        .button-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 1px solid gray;
        }
    </style>
</head>
<body>

    <h1>Device Control</h1>

    <a 
        href="https://www.example.com"
        target="myDeviceFrame"
        class="button-link">
        Open Device Content
    </a>

    <br>

    <iframe
        name="myDeviceFrame"
        src="about:blank"
        title="USB Device Content Frame"
        allow="usb">
    </iframe>

</body>
</html>
</body>
</html>
