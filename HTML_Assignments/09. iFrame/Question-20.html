<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Iframe</title>

    <style>
        iframe {
            width: 100%;
            height: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <h2>Embedded Website</h2>

    <iframe
        src="https://www.example.com"
        title="Example Website"
        allow="gyroscope">
    </iframe>

</body>
</html>
