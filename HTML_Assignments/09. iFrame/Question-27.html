<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Links with Named Iframe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            margin: 10px 0;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 1px solid gray;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Website Viewer</h1>

    <ul>
        <li>
            <a href="https://www.example.com" target="contentFrame">
                Open Example
            </a>
        </li>

        <li>
            <a href="https://www.wikipedia.org" target="contentFrame">
                Open Wikipedia
            </a>
        </li>

        <li>
            <a href="https://www.youtube.com" target="contentFrame">
                Open YouTube
            </a>
        </li>
    </ul>

    <iframe
        name="contentFrame"
        src="about:blank"
        title="Website Content Viewer"
        allow="fullscreen">
    </iframe>

</body>
</html>
